<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="deck-template" content="{{TPL_ID}}">
{{FONT_IMPORTS}}
<style>
/* Pretendard — 덱 옆 lecture-assets 에서. 인터넷 없이도 뜬다 */
@font-face{font-family:'Pretendard';font-weight:45 930;font-style:normal;font-display:swap;
  src:url('lecture-assets/fonts/Pretendard-subset.woff2') format('woff2')}

:root{
{{TOKENS_CSS}}
  --f-body:var(--font-body,'Pretendard'),-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-display:var(--font-display,'Pretendard'),-apple-system,sans-serif;
  --rule:color-mix(in srgb, var(--ink) 16%, transparent);
  --rule-soft:color-mix(in srgb, var(--ink) 9%, transparent);
  --ease:cubic-bezier(.16,1,.3,1);
}

/* ── 고정 16:9 무대 ─────────────────────────── */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:color-mix(in srgb, var(--paper) 88%, var(--ink))}
.deck-viewport{position:fixed;inset:0;overflow:hidden}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--paper)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;visibility:hidden;opacity:0;pointer-events:none;background:var(--paper);font-family:var(--f-body);color:var(--ink)}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
img{display:block;max-width:100%}
@page{size:1920px 1080px;margin:0}
@media print{
  html,body{width:1920px;height:auto;overflow:visible;background:#fff}
  .deck-viewport{position:static;overflow:visible}
  .deck-stage{position:static;width:auto;height:auto;transform:none!important}
  .slide{position:relative;display:block!important;visibility:visible!important;opacity:1!important;break-after:page}
  .slide:last-child{break-after:auto}
}

/* ── 공통 부품 ─────────────────────────────── */
.pad{position:absolute;left:96px;right:96px;top:72px;bottom:64px}
.eyebrow{font-size:19px;letter-spacing:.2em;color:var(--accent);font-weight:600}
.slide h2{margin:14px 0 0;font-weight:600;font-size:60px;line-height:1.16;letter-spacing:-.035em}
.slide h2 u{text-decoration:none;color:var(--accent)}
.head-rule{margin-top:24px;height:1px;background:var(--rule)}
.lede{margin-top:20px;font-weight:300;font-size:27px;line-height:1.55;color:color-mix(in srgb, var(--ink) 76%, var(--paper));max-width:1520px}
.body{position:absolute;left:96px;right:96px;top:262px;bottom:96px}
.folio{position:absolute;right:96px;bottom:36px;font-size:17px;letter-spacing:.14em;color:color-mix(in srgb, var(--ink) 45%, var(--paper))}
.card{background:color-mix(in srgb, var(--paper) 60%, white);border:1px solid var(--rule-soft);padding:32px 34px;display:flex;flex-direction:column}
.card h3{margin:0;font-weight:600;font-size:31px;line-height:1.3}
.card p{margin:14px 0 0;font-weight:300;font-size:24px;line-height:1.6;color:color-mix(in srgb, var(--ink) 76%, var(--paper))}
.card .tag{font-size:16px;letter-spacing:.16em;color:var(--accent);margin-bottom:12px;font-weight:600}
.card.accent{background:var(--accent);border-color:var(--accent)}
.card.accent *{color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:40px;height:100%}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;height:100%}
.strong{font-weight:600;color:var(--ink)}
.shot{background:#fff;border:1px solid var(--rule);overflow:hidden;position:relative}
.shot img{width:100%;height:100%;object-fit:cover;object-position:center top}
.shot .cap{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb, var(--ink) 88%, transparent);color:var(--paper);font-size:16px;letter-spacing:.08em;padding:10px 14px}

/* ── 슬라이드 유형 ──────────────────────────── */
/* 표지 */
.slide--title .t-eyebrow{position:absolute;left:96px;top:190px;font-size:20px;letter-spacing:.22em;color:var(--accent);font-weight:600}
.slide--title h1{position:absolute;left:96px;top:300px;width:1300px;margin:0;font-family:var(--f-display);font-weight:700;font-size:100px;line-height:1.12;letter-spacing:-.038em}
.slide--title h1 u{text-decoration:none;color:var(--accent)}
.slide--title .t-sub{position:absolute;left:96px;top:660px;width:1200px;font-weight:200;font-size:32px;line-height:1.6;color:color-mix(in srgb, var(--ink) 76%, var(--paper))}
.slide--title .t-by{position:absolute;left:96px;bottom:60px;font-size:19px;letter-spacing:.14em;color:color-mix(in srgb, var(--ink) 45%, var(--paper))}
.slide--title .t-block{position:absolute;top:0;right:0;width:520px;height:1080px;background:var(--accent)}

/* 장 구분 */
.slide--section{background:var(--ink)}
.slide--section .kick{position:absolute;left:96px;top:136px;font-size:19px;letter-spacing:.22em;color:color-mix(in srgb, var(--paper) 50%, transparent)}
.slide--section .num{position:absolute;left:96px;top:180px;font-family:var(--f-display);font-weight:900;font-size:280px;line-height:.8;color:var(--accent);letter-spacing:-.06em}
.slide--section h2{position:absolute;left:96px;top:560px;width:1500px;color:var(--paper);font-size:84px;font-weight:600;line-height:1.2}
.slide--section .note{position:absolute;left:96px;bottom:120px;width:1400px;font-weight:300;font-size:27px;line-height:1.6;color:color-mix(in srgb, var(--paper) 72%, transparent)}

/* 큰 숫자 3개 */
.slide--big-stat .stat b{display:block;font-family:var(--f-display);font-weight:700;font-size:96px;letter-spacing:-.03em;line-height:1}
.slide--big-stat .stat span{display:block;margin-top:16px;font-size:24px;font-weight:300;color:color-mix(in srgb, var(--ink) 70%, var(--paper))}

/* 목록 */
.slide--list .body ul{margin:0;padding:0;list-style:none}
.slide--list .body li{font-weight:300;font-size:30px;line-height:1.6;padding:22px 0 22px 40px;border-bottom:1px solid var(--rule-soft);position:relative}
.slide--list .body li::before{content:"";position:absolute;left:0;top:44px;width:18px;height:2px;background:var(--accent)}
.slide--list .body li .strong{font-weight:600}

/* 인용 */
.slide--quote .q{position:absolute;left:96px;right:96px;top:50%;transform:translateY(-50%);font-weight:300;font-size:64px;line-height:1.5;letter-spacing:-.02em}
.slide--quote .q u{text-decoration:none;color:var(--accent)}
.slide--quote .who{position:absolute;left:96px;bottom:140px;font-size:22px;letter-spacing:.1em;color:color-mix(in srgb, var(--ink) 50%, var(--paper))}

/* 이미지 중심 */
.slide--image-full .body{display:flex;gap:40px;align-items:stretch}
.slide--image-full .shot{flex:1}
.slide--image-full .aside{width:560px;display:flex;flex-direction:column;justify-content:center}
.slide--image-full .aside p{font-weight:300;font-size:27px;line-height:1.65;color:color-mix(in srgb, var(--ink) 76%, var(--paper))}

/* 맺음 */
.slide--closing .statement{position:absolute;left:96px;right:96px;top:44%;transform:translateY(-50%);font-weight:600;font-size:76px;line-height:1.35;letter-spacing:-.03em}
.slide--closing .statement u{text-decoration:none;color:var(--accent)}
.slide--closing .sub{position:absolute;left:96px;bottom:180px;width:1500px;font-weight:300;font-size:28px;line-height:1.65;color:color-mix(in srgb, var(--ink) 72%, var(--paper))}

{{EXTRA_CSS}}
</style>
</head>
<body>
<div class="deck-viewport">
<main class="deck-stage" id="deckStage">
{{SLIDES}}
</main>
</div>

<script>
/* 발표 장치 — 넘김·스케일. 편집기는 이 파일을 iframe 으로 열어 DOM 만 만진다. */
class SlidePresentation {
  constructor(){
    this.slides = document.querySelectorAll('.slide');
    this.current = 0;
    this.stage = document.getElementById('deckStage');
    this.setupStageScale();
    this.setupNav();
    /* #s7 (또는 #7) 이면 7장부터 — 편집기의 「발표」가 현재 장을 이렇게 넘겨준다 */
    const m = location.hash.match(/^#s?(\d+)$/);
    this.showSlide(m ? Math.max(0, Math.min(+m[1] - 1, this.slides.length - 1)) : 0);
  }
  setupStageScale(){
    const fit = () => {
      const f = Math.min(innerWidth/1920, innerHeight/1080);
      const x = (innerWidth - 1920*f)/2, y = (innerHeight - 1080*f)/2;
      this.stage.style.transform = `translate(${x}px,${y}px) scale(${f})`;
    };
    fit(); addEventListener('resize', fit);
  }
  showSlide(i){
    if (i < 0 || i >= this.slides.length) return;
    this.current = i;
    this.slides.forEach((s,k)=>{ s.classList.toggle('active', k===i); s.classList.toggle('visible', k===i); });
  }
  next(){ this.showSlide(this.current+1); }
  prev(){ this.showSlide(this.current-1); }
  setupNav(){
    document.addEventListener('keydown', (e) => {
      if (window.__DECK_EDIT_MODE) return;                 /* 편집 모드에선 발표 단축키 정지 */
      if (e.target.isContentEditable) return;
      if (['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); this.next(); }
      if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); this.prev(); }
      if (e.key === 'Home') this.showSlide(0);
      if (e.key === 'End') this.showSlide(this.slides.length-1);
    });
    let x0 = null;
    document.addEventListener('touchstart', (e)=>{ x0 = e.touches[0].clientX; }, {passive:true});
    document.addEventListener('touchend', (e)=>{
      if (x0===null || window.__DECK_EDIT_MODE) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 55) dx < 0 ? this.next() : this.prev();
    }, {passive:true});
  }
}
window.deck = new SlidePresentation();
if (new URLSearchParams(location.search).has('print')) {
  document.fonts.ready.then(() => setTimeout(() => window.print(), 400));
}
</script>
<!-- pe-video-runtime v1 -->
<script>
(function(){
  if (window.__PE_VIDEO) return;          /* 두 번 꽂혀도 한 번만 */
  window.__PE_VIDEO = true;

  /* ── 발표 중에만 쓰는 옷. 편집기는 자기 옷을 따로 입는다. */
  var CSS = [
    '.pe-slot>video{display:block;width:100%;height:100%;object-fit:cover;object-position:center;background:#0b0b09}',
    '.pe-slot[data-fit="contain"]>video{object-fit:contain}',

    /* 인트로 — 영상이 먼저, 글은 나중 */
    '.pe-imgzone[data-pos="cinema"]{left:0;top:0;width:1920px;height:1080px;z-index:0;gap:0}',
    '.pe-imgzone[data-pos="cinema"] .pe-slot{border:0;background:#0b0b09}',
    '.slide[data-pe-img="cinema"]>:not(.pe-imgzone){z-index:2}',
    '.pe-imgzone[data-pos="cinema"]::after{content:"";position:absolute;inset:0;z-index:1;opacity:1;',
      'transition:opacity 1.1s cubic-bezier(.22,1,.36,1);',
      'background:linear-gradient(90deg,rgba(11,11,9,.80) 0%,rgba(11,11,9,.42) 58%,rgba(11,11,9,.14) 100%)}',
    /* 기다리는 동안: 어둠도 글도 없다 — 영상만 */
    '.slide.pe-cine-wait .pe-imgzone[data-pos="cinema"]::after{opacity:0}',
    '.slide.pe-cine-wait>:not(.pe-imgzone){opacity:0!important;transition:opacity .5s ease}',
    '.slide.pe-cine-wait .reveal{opacity:0!important;transform:translateY(20px)!important}',

    /* 호버 컨트롤 */
    '.pe-vbar{position:absolute;left:0;right:0;bottom:0;z-index:9;display:flex;align-items:center;gap:14px;',
      'padding:26px 28px 20px;opacity:0;transform:translateY(10px);pointer-events:none;',
      'transition:opacity .22s ease,transform .22s ease;font-family:Pretendard,-apple-system,sans-serif;',
      'background:linear-gradient(to top,rgba(11,11,9,.78),rgba(11,11,9,0))}',
    '.pe-vslot.pe-vshow .pe-vbar{opacity:1;transform:none;pointer-events:auto}',
    '.pe-vbar button{flex:0 0 auto;width:44px;height:44px;border:0;border-radius:50%;cursor:pointer;',
      'background:rgba(255,255,255,.14);color:#fff;font-size:19px;line-height:1;display:flex;',
      'align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:background .15s}',
    '.pe-vbar button:hover{background:rgba(255,255,255,.30)}',
    '.pe-vbar .pe-vseek{flex:1 1 auto;height:34px;display:flex;align-items:center;cursor:pointer}',
    '.pe-vbar .pe-vtrack{width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.26);overflow:hidden}',
    '.pe-vbar .pe-vfill{height:100%;width:0;background:#fff;border-radius:3px}',
    '.pe-vbar .pe-vtime{flex:0 0 auto;color:rgba(255,255,255,.88);font-size:16px;font-weight:500;',
      'font-variant-numeric:tabular-nums;letter-spacing:.02em}',

    /* 소리를 켠 순간 잠깐 뜨는 알림 */
    '.pe-vtoast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(8px);z-index:99999;',
      'background:rgba(11,11,9,.88);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;',
      'font-weight:600;font-family:Pretendard,-apple-system,sans-serif;opacity:0;pointer-events:none;',
      'transition:opacity .2s ease,transform .2s ease;backdrop-filter:blur(8px)}',
    '.pe-vtoast.on{opacity:1;transform:translateX(-50%)}',

    /* 인쇄(PDF) — 영상은 안 찍힌다. 잡아 둔 첫 화면이 자리를 대신한다. */
    '@media print{.pe-vbar{display:none}',
      '.pe-slot>video{display:none}',
      '.pe-vslot[data-poster]{background-size:cover;background-position:center}',
      '.slide.pe-cine-wait>:not(.pe-imgzone){opacity:1!important}',
      '.slide.pe-cine-wait .reveal{opacity:1!important;transform:none!important}',
      '.slide.pe-cine-wait .pe-imgzone[data-pos="cinema"]::after{opacity:1}}'
  ].join('\n');

  var st = document.createElement('style');
  st.id = 'pe-video-css';
  st.textContent = CSS;
  document.head.appendChild(st);

  var cineTimer = null;

  /* ── 소리는 발표 하나 동안 기억한다.
        한 번 켠 사람이 장마다 다시 누르게 하지 않는다. */
  if (typeof window.__DECK_SOUND !== 'boolean') window.__DECK_SOUND = false;

  var mmss = function(t){
    if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  var toastEl = null, toastTimer = null;
  function toast(msg){
    if (!toastEl){
      toastEl = document.createElement('div');
      toastEl.className = 'pe-vtoast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 1500);
  }

  /* ═══ 슬롯 하나 ═══ */
  function setup(slot){
    if (slot.__peReady) return;
    var v = slot.querySelector('video');
    if (!v) return;
    slot.__peReady = true;
    slot.classList.add('pe-vslot');

    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.muted = true;                        /* 소리 있는 자동재생은 브라우저가 막는다 */
    v.loop = slot.dataset.loop !== '0';
    v.preload = 'auto';
    if (slot.dataset.poster) slot.style.backgroundImage = 'url("' + slot.dataset.poster + '")';

    /* 컨트롤 */
    var bar = document.createElement('div');
    bar.className = 'pe-vbar';
    bar.innerHTML =
      '<button data-a="play" title="재생 / 멈춤">▶</button>' +
      '<button data-a="restart" title="처음부터">↺</button>' +
      '<div class="pe-vseek"><div class="pe-vtrack"><div class="pe-vfill"></div></div></div>' +
      '<div class="pe-vtime">0:00</div>' +
      '<button data-a="sound" title="소리">🔇</button>';
    slot.appendChild(bar);

    var bPlay  = bar.querySelector('[data-a="play"]');
    var bSound = bar.querySelector('[data-a="sound"]');
    var seek   = bar.querySelector('.pe-vseek');
    var fill   = bar.querySelector('.pe-vfill');
    var time   = bar.querySelector('.pe-vtime');

    function paint(){
      bPlay.textContent = v.paused ? '▶' : '❚❚';
      bSound.textContent = v.muted ? '🔇' : '🔊';
      var d = v.duration;
      fill.style.width = (isFinite(d) && d > 0 ? (v.currentTime / d) * 100 : 0) + '%';
      time.textContent = mmss(v.currentTime) + (isFinite(d) && d > 0 ? ' / ' + mmss(d) : '');
    }
    v.addEventListener('timeupdate', paint);
    v.addEventListener('loadedmetadata', paint);
    v.addEventListener('play', paint);
    v.addEventListener('pause', paint);

    bar.addEventListener('click', function(e){
      var a = e.target.closest('button') && e.target.closest('button').dataset.a;
      if (!a) return;
      e.stopPropagation();
      if (a === 'play'){ v.paused ? v.play().catch(function(){}) : v.pause(); }
      if (a === 'restart'){ v.currentTime = 0; v.play().catch(function(){}); }
      if (a === 'sound'){
        window.__DECK_SOUND = v.muted;
        applySound();
        toast(window.__DECK_SOUND ? '🔊 소리 켬' : '🔇 소리 끔');
      }
      paint();
    });

    /* 진행바를 끌어 탐색 */
    function scrub(e){
      var r = seek.getBoundingClientRect();
      var p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      if (isFinite(v.duration)) v.currentTime = p * v.duration;
      paint();
    }
    seek.addEventListener('mousedown', function(e){
      e.stopPropagation(); e.preventDefault(); scrub(e);
      var move = function(ev){ scrub(ev); };
      var up = function(){ document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });

    /* 마우스를 올리면 뜨고, 2초 가만있으면 사라진다 */
    var hideTimer = null;
    function wake(){
      slot.classList.add('pe-vshow');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function(){ slot.classList.remove('pe-vshow'); }, 2000);
    }
    slot.addEventListener('mousemove', wake);
    slot.addEventListener('mouseenter', wake);
    slot.addEventListener('mouseleave', function(){ clearTimeout(hideTimer); slot.classList.remove('pe-vshow'); });

    /* 영상을 누르면 재생/멈춤 — 컨트롤을 안 써도 된다 */
    v.addEventListener('click', function(e){
      if (document.body.classList.contains('editing') || window.__DECK_EDIT_MODE) return;
      e.stopPropagation();
      v.paused ? v.play().catch(function(){}) : v.pause();
    });

    paint();
  }

  function applySound(){
    document.querySelectorAll('.pe-vslot video').forEach(function(v){
      var slot = v.closest('.pe-vslot');
      var wants = slot && slot.dataset.sound === '1';
      /* 이 장이 소리를 원하지 않으면 계속 음소거. 원하면 발표 전체 설정을 따른다. */
      v.muted = !(wants && window.__DECK_SOUND);
    });
  }

  /* ═══ 장이 바뀔 때 ═══ */
  function leave(slide){
    slide.classList.remove('pe-cine-wait');
    slide.querySelectorAll('.pe-vslot video').forEach(function(v){
      v.pause();
      try { v.currentTime = 0; } catch(e){}     /* 되감아 둔다 — 다음에 다시 오면 처음부터 */
    });
  }

  function editing(){
    return !!(window.__DECK_EDIT_MODE || document.body.classList.contains('editing'));
  }

  /** 편집기가 붙는 순간 부른다 — 편집 중에 영상이 저 혼자 돌면 방해만 된다. */
  window.__peStopAll = function(){
    clearTimeout(cineTimer);
    document.querySelectorAll('.slide.pe-cine-wait').forEach(function(s){ s.classList.remove('pe-cine-wait'); });
    document.querySelectorAll('.pe-vslot video').forEach(function(v){ v.pause(); });
  };

  function enter(slide){
    slide.querySelectorAll('.pe-vslot').forEach(function(slot){
      setup(slot);
      var v = slot.querySelector('video');
      if (!v) return;
      v.muted = !(slot.dataset.sound === '1' && window.__DECK_SOUND);
      if (editing()) return;                  /* 편집 중엔 틀지 않는다 */
      if (slot.dataset.autoplay !== '0'){
        var p = v.play();
        if (p && p.catch) p.catch(function(){
          /* 브라우저가 막으면 음소거로 한 번 더 — 이건 언제나 통한다 */
          v.muted = true; v.play().catch(function(){});
        });
      }
    });

    /* 인트로: 영상만 먼저 보여주고 글을 늦춘다 */
    clearTimeout(cineTimer);
    var cine = slide.querySelector('.pe-imgzone[data-pos="cinema"] .pe-vslot');
    if (!cine) return;
    var delay = parseInt(cine.dataset.delay || '2500', 10);
    if (!(delay > 0) || editing()) return;
    if (window.matchMedia && window.matchMedia('print').matches) return;
    slide.classList.add('pe-cine-wait');
    cineTimer = setTimeout(function(){ slide.classList.remove('pe-cine-wait'); }, delay);
  }

  /** 기다리는 중에 넘기려 하면, 넘기지 말고 글부터 보여준다 */
  function revealNow(){
    var w = document.querySelector('.slide.pe-cine-wait');
    if (!w) return false;
    clearTimeout(cineTimer);
    w.classList.remove('pe-cine-wait');
    return true;
  }
  window.__peRevealIntro = revealNow;

  document.addEventListener('keydown', function(e){
    if (window.__DECK_EDIT_MODE || document.body.classList.contains('editing')) return;
    if (e.target && e.target.isContentEditable) return;
    if (['ArrowRight','ArrowDown',' ','PageDown','Enter'].indexOf(e.key) < 0) return;
    if (revealNow()){ e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);                                   /* 발표 장치보다 먼저 잡는다 */

  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('.pe-vbar,.pe-ui')) return;
    revealNow();
  });

  /* 발표 장치가 덱마다 다르다. class 변화를 지켜보는 쪽이 확실하다. */
  var seen = null;
  function sync(){
    var now = document.querySelector('.slide.active') || document.querySelector('.slide.visible');
    if (!now || now === seen) return;
    if (seen) leave(seen);
    seen = now;
    enter(now);
  }
  new MutationObserver(sync).observe(document.body, {
    subtree: true, attributes: true, attributeFilter: ['class']
  });

  function boot(){
    document.querySelectorAll('.pe-vslot,.pe-slot').forEach(function(s){
      if (s.querySelector('video')) setup(s);
    });
    sync();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* 인쇄 직전엔 기다림을 풀어 둔다 — PDF 에 빈 장이 남지 않게 */
  window.addEventListener('beforeprint', function(){
    clearTimeout(cineTimer);
    document.querySelectorAll('.slide.pe-cine-wait').forEach(function(s){ s.classList.remove('pe-cine-wait'); });
  });
})();
</script>
<!-- /pe-video-runtime -->
</body>
</html>
